<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Logo Graphics Group (Transparent Background) -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- TOP SECTION -->
    <!-- Top Outer Diamond -->
    <polygon points="100,25 165,62.5 100,100 35,62.5" />
    
    <!-- Top Inner Diamond -->
    <polygon points="67.5,43.75 132.5,43.75 132.5,81.25 67.5,81.25" />
    
    <!-- Top Center Vertical Line -->
    <line x1="100" y1="25" x2="100" y2="62.5" />
    
    <!-- Top Inner Lines -->
    <line x1="100" y1="62.5" x2="67.5" y2="81.25" />
    <line x1="100" y1="62.5" x2="132.5" y2="81.25" />

    <!-- BOTTOM SECTION -->
    <!-- Bottom Outer Diamond -->
    <polygon points="100,100 165,137.5 100,175 35,137.5" />
    
    <!-- Bottom Inner Diamond -->
    <polygon points="67.5,118.75 132.5,118.75 132.5,156.25 67.5,156.25" />
    
    <!-- Bottom Center Vertical Line -->
    <line x1="100" y1="175" x2="100" y2="137.5" />
    
    <!-- Bottom Inner Lines -->
    <line x1="100" y1="137.5" x2="67.5" y2="118.75" />
    <line x1="100" y1="137.5" x2="132.5" y2="118.75" />
    
  </g>
</svg>
