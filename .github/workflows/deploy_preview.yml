name: Deploy Preview

on:
  workflow_run:
    workflows: ["Build PR Artifact"]
    types:
      - completed

# Cancel in-progress jobs or runs for the same head branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# workflow_run always executes with the permissions and secrets of the
# base repository, even when the triggering workflow ran against a PR
# from a fork. That's what lets this job authenticate to AWS - unlike
# the "pull_request" event used in build_pr.yml, it is never downgraded
# to a read-only, secret-less token.
permissions:
  contents: read
  statuses: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if the triggering build succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: pr
        run: |
          echo "PR_NUM=$(cat build-metadata/pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "STATUSES_URL=$(cat build-metadata/statuses_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # actions/checkout blocks checking out a fork PR's head commit
          # inside a privileged workflow_run job by default, because doing
          # so and then running that commit's code (npm ci, sst deploy)
          # hands attacker-controlled code this job's secrets and AWS
          # credentials - the "pwn request" pattern. This project accepts
          # that risk deliberately to support automatic preview deploys
          # for fork PRs; allow-unsafe-pr-checkout opts back in to it.
          allow-unsafe-pr-checkout: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: 3.117.0

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy Preview
        id: deploy
        run: |
          if OUTPUT=$(npx sst deploy --stage pr-${{ steps.pr.outputs.PR_NUM }} 2>&1); then
            echo "Deployment succeeded"
            echo "$OUTPUT"
          else
            echo "Deployment failed"
            echo "$OUTPUT"
            exit 1
          fi

          URL=$(echo "$OUTPUT" | grep "CC-Website: https://" | head -n 1 | awk '{print $2}')

          if [ -z "$URL" ]; then
            echo "Could not find deployment URL in output"
          else
            echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
            echo "Deployment URL: $URL"
          fi

      - name: Update Status
        if: success() && steps.deploy.outputs.preview_url
        run: |
          STATUSES_URL="${{ steps.pr.outputs.STATUSES_URL }}"
          DATA=$(jq -n \
            --arg url "${{ steps.deploy.outputs.preview_url }}" \
            '{state: "success", target_url: $url, context: "Deploy preview", description: "Preview deployment complete"}')
          curl -s -S -H "Content-Type: application/json" -H "Authorization: token $TOKEN" -d "$DATA" "$STATUSES_URL"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report failure
        if: failure()
        run: |
          STATUSES_URL="${{ steps.pr.outputs.STATUSES_URL }}"
          if [ -n "$STATUSES_URL" ]; then
            DATA=$(jq -n \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --arg context "Deploy preview" \
              --arg desc "Deployment failed" \
              '{state: "failure", target_url: $url, context: $context, description: $desc}')
            curl -s -S -H "Content-Type: application/json" -H "Authorization: token $TOKEN" -d "$DATA" "$STATUSES_URL"
          fi
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
